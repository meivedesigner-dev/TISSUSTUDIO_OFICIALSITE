[build]
  publish = "."

# /cursos leva para a lista de cursos da home
[[redirects]]
  from = "/cursos"
  to = "/#cursos"
  status = 301

[[redirects]]
  from = "/cursos/"
  to = "/#cursos"
  status = 301

# link curto para bio/stories
[[redirects]]
  from = "/velvet"
  to = "/cursos/boneca-velvet/"
  status = 301

[[redirects]]
  from = "/sagrada"
  to = "/cursos/sagrada-familia/"
  status = 301

# Cabeçalhos de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
